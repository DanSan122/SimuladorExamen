<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen - Matemática Aplicada a la Computación</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --primary-color: #FF9800;
            --primary-hover: #F57C00;
            --secondary-color: #333;
            --border-color: #444;
            --correct-bg: #2d4a2d;
            --correct-text: #4caf50;
            --incorrect-bg: #4a2d2d;
            --incorrect-text: #f44336;
            --card-bg: #2a2a2a;
            --highlight-color: #3a3a3a;
        }
    
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
    
        h1, h2, h3 {
            color: #f5f5f5;
        }
    
        .question {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
    
        .question:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }
    
        .options {
            margin-left: 25px;
            margin-top: 15px;
        }
    
        input[type="radio"] {
            accent-color: var(--primary-color);
            margin-right: 10px;
            transform: scale(1.1);
        }
    
        label {
            cursor: pointer;
            user-select: none;
        }
    
        button {
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
    
        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
    
        #timer {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--secondary-color);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            border: 2px solid var(--primary-color);
        }
    
        #loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
            color: var(--text-color);
        }
    
        /* Estilos para pregunta individual */
        .question-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .progress-info h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--secondary-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), #FFB74D);
            transition: width 0.5s ease;
        }

        .question-text {
            margin: 20px 0;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .option-item {
            margin-bottom: 15px;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background-color: var(--highlight-color);
            transform: translateX(5px);
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background-color: rgba(33, 150, 243, 0.2);
            transform: scale(1.02);
        }

        .option-item input[type="radio"] {
            margin-right: 15px;
        }

        .option-item label {
            font-size: 1rem;
            line-height: 1.4;
        }

        /* Botón siguiente */
        .next-button-container {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .next-button {
            padding: 15px 30px;
            background: linear-gradient(45deg, var(--primary-color), #FFB74D);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            min-width: 200px;
        }

        .next-button:hover:not(.disabled) {
            background: linear-gradient(45deg, var(--primary-hover), #FF9800);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
        }

        .next-button.disabled {
            background: var(--secondary-color);
            color: #999;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }

        /* Estilos para resultados */
        .results-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--card-bg), #333);
            border-radius: 15px;
            border: 1px solid var(--border-color);
        }

        .score-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), #FFB74D);
            color: white;
            font-weight: bold;
        }

        .score-summary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .score-percentage {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .score-text {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .score-details {
            text-align: left;
        }

        .score-details p {
            margin: 8px 0;
            font-size: 1.1rem;
        }

        .results-review {
            margin: 30px 0 20px;
            padding: 15px;
            background-color: var(--highlight-color);
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .question-review {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .correct-review {
            background-color: rgba(76, 175, 80, 0.1);
            border-left: 4px solid #4caf50;
        }

        .incorrect-review {
            background-color: rgba(244, 67, 54, 0.1);
            border-left: 4px solid #f44336;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .review-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .review-status.correct {
            background-color: var(--correct-bg);
            color: var(--correct-text);
        }

        .review-status.incorrect {
            background-color: var(--incorrect-bg);
            color: var(--incorrect-text);
        }

        .restart-section {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            border-top: 2px solid var(--border-color);
        }

        .restart-button, .home-button {
            margin: 10px;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .restart-button {
            background: linear-gradient(45deg, var(--primary-color), #FFB74D);
            color: white;
        }

        .home-button {
            background: linear-gradient(45deg, #607D8B, #78909C);
            color: white;
        }

        @media (max-width: 768px) {
            .score-summary {
                flex-direction: column;
                gap: 20px;
            }
            
            .score-details {
                text-align: center;
            }
        }

        /* Soporte para fórmulas matemáticas */
        .math-formula {
            font-family: 'Times New Roman', serif;
            font-size: 1.1em;
            background-color: rgba(33, 150, 243, 0.1);
            padding: 5px 10px;
            border-radius: 4px;
            margin: 5px 0;
            display: inline-block;
        }
    </style>
    <link rel="stylesheet" href="../assets/ui.css">
</head>
<body data-duration="30" class="exam-page">
    <nav class="site-nav" aria-label="Navegación principal">
        <a class="site-brand" href="../index.html"><span class="brand-mark" aria-hidden="true">✓</span> Simula / Examen</a>
        <span class="nav-caption">Tu siguiente paso empieza aquí</span>
    </nav>
    <div class="header-controls"><a class="back-button" href="index.html">← Salir del examen</a><div id="timer">Tiempo: 30:00</div></div>
    <p class="eyebrow">Sesión de práctica</p>
    <h1>Experiencia de Usuario</h1>
    <div id="loading">Cargando preguntas de experiencia de usuario...</div>
    <div id="quiz-container" style="display:none;"></div>
    <button id="submit-btn" style="display:none;">Verificar Respuestas</button>
    <div id="results" class="result" style="display:none;"></div>

    <script defer src="../assets/exam-core.js"></script>
    <script defer src="../assets/exam.js"></script>
    
    <!-- Vercel Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>

</body>
</html>
